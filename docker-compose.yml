name: personal-tracker

services:
  postgres:
    image: postgres:16-alpine
    container_name: personal_tracker_demo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_tracker
    ports:
      - "5432:5432"
    volumes:
      - personal_tracker_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  personal_tracker_demo_data:
